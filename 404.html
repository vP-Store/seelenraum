<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hier ist nur Sternenstaub · Seelenraum</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23cdb4e6'/%3E%3Cstop offset='1' stop-color='%238a76a8'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23fff' stroke-opacity='.85' stroke-width='2'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',Arial,sans-serif;color:#efeaf6;line-height:1.7;min-height:100vh;
    background:radial-gradient(120% 90% at 50% 112%,#2a2350 0%,#171230 55%,#0b0a18 100%);
    display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
  .stars span{position:fixed;color:#cdb9ee;opacity:0;animation:tw ease-in-out infinite;pointer-events:none}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.4;transform:scale(1.1)}}
  .card{max-width:480px;animation:up 1s cubic-bezier(.22,.61,.36,1) both}
  @keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .moon{font-size:64px;display:block;margin-bottom:18px;animation:fl 6s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
  .brand{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#d8b87e;font-weight:600}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,7vw,46px);color:#fff;line-height:1.15;margin:12px 0 12px}
  p{color:rgba(255,255,255,.68);font-size:16px;margin-bottom:30px}
  a.cta{display:inline-block;font-size:14px;letter-spacing:.06em;font-weight:600;text-decoration:none;
    background:linear-gradient(135deg,#c7a064,#a87e44);color:#fff;border-radius:30px;padding:15px 36px;margin:0 6px 10px;
    box-shadow:0 10px 32px rgba(160,120,60,.35);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  a.cta:hover{transform:translateY(-3px)}
  a.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);box-shadow:none;color:#d9d0ea}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="card">
  <span class="moon">☾</span>
  <div class="brand">Seelenraum</div>
  <h1>Hier draußen ist nur Sternenstaub.</h1>
  <p>Die Seite, die du suchst, gibt es nicht — oder sie ist weitergezogen. Dein Raum wartet trotzdem auf dich.</p>
  <a class="cta" href="/seelenraum/">Zur Startseite ✦</a>
  <a class="cta ghost" href="/seelenraum/seelenraum-app.html">Zur App</a>
</div>
<script>
(function(){var s=document.getElementById('stars'),h='';
for(var i=0;i<26;i++){h+='<span style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+'%;font-size:'+(8+Math.random()*9).toFixed(0)+'px;animation-duration:'+(3+Math.random()*5).toFixed(1)+'s;animation-delay:'+(-Math.random()*8).toFixed(1)+'s">✦</span>';}
s.innerHTML=h;})();
</script>
</body>
</html>
